name: NYEOCARE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NYEOCARE_URL: https://nyeocare.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Capacitor web shell
        run: |
          rm -rf out
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><p>Opening NYEOCARE…</p></body></html>
          HTML
          node - <<'NODE'
          const fs=require('fs');
          const p='capacitor.config.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.server={...(c.server||{}),url:process.env.NYEOCARE_URL,cleartext:false};
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NYEOCARE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
