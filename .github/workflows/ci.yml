name: NYEOCARE CI
# CI tests and builds every change. Production verification is opt-in because Vercel Git deployment is currently disabled.

on:
  push:
    branches: [main, scan-v70-identity-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyeocare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:persistence
      - run: npm run test:review-surface
      - run: npm run test:scan
      - run: npm run test:attendance-service-pattern
      - run: npm run test:attendance-register-truth
      - run: npm run test:aria-attendance-workspace
      - run: npm run test:foreign-key-indexes
      - run: npm run test:event-date
      - run: npm run test:attendance-access
      - run: npm run test:attendance-history
      - run: npm run test:person-create-idempotency
      - run: npm run test:identity-review
      - run: npm run test:tenant-isolation
      - run: npm run test:strict-tenant-api
      - run: npm run test:daily-briefing
      - run: npm run test:follow-up-policy
      - run: npm run test:care-intake-foundation
      - run: npm run test:care-production-gate
      - run: npm run test:release-hardening
      - run: npm run test:identity-evidence
      - run: npm run test:scan-review
      - run: npm run test:aria-internal-messaging
      - run: npm run test:critical-ui
      - run: npm run test:modal-layering
      - run: npm run test:experience
      - run: npm run test:aria-agentic-surfaces
      - run: npm run test:aria-bulk-people-type
      - run: npm run test:people-edit
      - run: npm run test:people-attendance-groups
      - run: npm run test:attendance-name-prefix
      - run: npm run test:diagnostics
      - run: npm run test:aria-today
      - run: npm run test:aria-universal
      - run: npm run test:aria-people
      - run: npm run test:aria-message-drafting
      - run: npm run test:aria
      - run: npm run test:auth
      - run: npm run test:operator-adoption
      - run: npm run test:legacy-attendance-care
      - run: npm run test:canonical-care-workspace
      - name: Syntax-check canonical care entry points
        run: |
          node --check pages/api/care-responsibilities.js
          node --check pages/api/aria/intake.js
          node --check pages/api/aria/intake-review.js
          node --check pages/api/person/journey.js
          node --check lib/aria/eventEmitter.js
          node --check lib/aria/eventProcessor.js
          node --check lib/aria/recommendationEngine.js
          node --check lib/aria/draftEngine.js
          node --check lib/aria/communicationOutcome.js
          node --check lib/aria/contactPreference.js
          node --check lib/aria/temporalEngine.js
          node --check lib/aria/attendanceIntelligence.js
          node --check lib/aria/feedbackEngine.js
          node --check pages/api/care-feedback.js
          node --check pages/api/daily-queue/complete-follow-up.js
          node --check lib/aria/careEngine.js
          node --check pages/api/person/journey.js
          node --check lib/dailyQueue.js
          node --check pages/api/daily-queue/complete-follow-up.js
      - run: npm run test:system-scale
      - run: npm run test:field-mode
      - name: Build application
        run: npm run build
      # Run only after the repository variable explicitly enables Vercel Git production deployments.
      - name: Verify Git-integrated Vercel production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NYEOCARE_VERCEL_GIT_DEPLOYMENT_ENABLED == 'true'
        env:
          EXPECTED_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          health_url="https://nyeocare.vercel.app/api/health"
          for attempt in $(seq 1 36); do
            response="$(curl --silent --show-error --fail --max-time 15 "$health_url" 2>/dev/null || true)"
            actual_build_id=""
            if [[ -n "$response" ]]; then
              actual_build_id="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(d.status!=="ok"||d.database!=="ok"||(d.queue!=="ok"&&d.queue!=="busy")||d.workers!=="ok"||d.aria_worker!=="ok"||d.build_id!==process.env.EXPECTED_BUILD_ID) process.exit(1); console.log(d.build_id);' <<<"$response" 2>/dev/null || true)"
            fi
            if [[ "$actual_build_id" == "$EXPECTED_BUILD_ID" ]]; then
              echo "Production health verified for commit $actual_build_id."
              exit 0
            fi
            echo "Waiting for Vercel Git deployment: expected $EXPECTED_BUILD_ID, observed ${actual_build_id:-not-ready} (attempt $attempt/36)."
            sleep 10
          done
          echo "Production did not become healthy on expected commit $EXPECTED_BUILD_ID."
          exit 1
      - name: Explain skipped production verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NYEOCARE_VERCEL_GIT_DEPLOYMENT_ENABLED != 'true'
        run: echo "Production verification skipped: Vercel Git deployment is disabled. This CI result covers tests and build only."
