name: NYEOCARE CI
# Production deploy path verified: push to main runs the full test gate and Vercel prebuilt deployment.

on:
  push:
    branches: [main, scan-v70-identity-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyeocare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
  VERCEL_ORG_ID: team_Hfzh4uRE9xewPAaGVjun6h19
  VERCEL_PROJECT_ID: prj_flnxmzr4QNgJK3SthDetLN0OLFKK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:persistence
      - run: npm run test:review-surface
      - run: npm run test:scan
      - run: npm run test:attendance-service-pattern
      - run: npm run test:attendance-register-truth
      - run: npm run test:aria-attendance-workspace
      - run: npm run test:foreign-key-indexes
      - run: npm run test:event-date
      - run: npm run test:attendance-access
      - run: npm run test:attendance-history
      - run: npm run test:person-create-idempotency
      - run: npm run test:identity-review
      - run: npm run test:tenant-isolation
      - run: npm run test:strict-tenant-api
      - run: npm run test:daily-briefing
      - run: npm run test:follow-up-policy
      - run: npm run test:care-intake-foundation
      - run: npm run test:identity-evidence
      - run: npm run test:scan-review
      - run: npm run test:aria-internal-messaging
      - run: npm run test:critical-ui
      - run: npm run test:modal-layering
      - run: npm run test:experience
      - run: npm run test:aria-agentic-surfaces
      - run: npm run test:aria-bulk-people-type
      - run: npm run test:people-edit
      - run: npm run test:people-attendance-groups
      - run: npm run test:attendance-name-prefix
      - run: npm run test:diagnostics
      - run: npm run test:aria-today
      - run: npm run test:aria-universal
      - run: npm run test:aria-people
      - run: npm run test:aria-message-drafting
      - run: npm run test:aria
      - run: npm run test:auth
      - run: npm run test:operator-adoption
      - run: npm run test:legacy-attendance-care
      - run: npm run test:canonical-care-workspace
      - name: Syntax-check canonical care entry points
        run: |
          node --check pages/api/care-responsibilities.js
          node --check pages/api/aria/intake.js
          node --check pages/api/aria/intake-review.js
          node --check pages/api/person/journey.js
          node --check lib/aria/eventEmitter.js
          node --check lib/aria/eventProcessor.js
          node --check lib/aria/recommendationEngine.js
          node --check lib/aria/draftEngine.js
          node --check lib/aria/communicationOutcome.js
          node --check lib/aria/contactPreference.js
          node --check lib/aria/temporalEngine.js
          node --check lib/aria/attendanceIntelligence.js
          node --check lib/aria/feedbackEngine.js
          node --check pages/api/care-feedback.js
          node --check pages/api/daily-queue/complete-follow-up.js
          node --check lib/aria/careEngine.js
          node --check pages/api/person/journey.js
          node --check lib/dailyQueue.js
          node --check pages/api/daily-queue/complete-follow-up.js
      - run: npm run test:system-scale
      - run: npm run test:field-mode
      - name: Build application
        run: npm run build
      - name: Create Vercel production deployment through the project API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vercel_deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg name "nyeocare" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg message "NYEOCARE production build $GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: {
                type: "github",
                org: "nicosheg",
                repo: "NYEOCARE",
                ref: "main",
                sha: $sha
              },
              meta: {
                githubCommitRef: "main",
                githubCommitSha: $sha,
                githubCommitMessage: $message,
                githubRepo: "NYEOCARE",
                githubOrg: "nicosheg"
              }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1&skipAutoDetectionConfirmation=1" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          deployment_id="$(jq -r '.id // empty' <<<"$response")"
          deployment_url="$(jq -r '.url // empty' <<<"$response")"
          if [[ -z "$deployment_id" || -z "$deployment_url" ]]; then
            echo "Vercel did not return a deployment ID and URL."
            jq '{error, message, readyState, state}' <<<"$response"
            exit 1
          fi
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Created production deployment $deployment_id."
      - name: Wait for Vercel production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vercel_ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.vercel_deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.vercel_deployment.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            response="$(curl --fail-with-body --silent --show-error \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$response")"
            echo "Vercel deployment state: $state (attempt $attempt/36)"
            case "$state" in
              READY)
                echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                jq '{id, url, readyState, errorCode, errorMessage}' <<<"$response"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Vercel deployment did not become READY within the polling window."
          exit 1
      - name: Verify production health after deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors --max-time 15 https://nyeocare.vercel.app/api/health
