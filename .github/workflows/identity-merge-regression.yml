name: identity-merge-regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  identity-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check identity merge modules
        run: |
          node --experimental-default-type=module --check pages/api/review/duplicate-action.js
          node --experimental-default-type=module --check lib/identityResolver.js
          node --experimental-default-type=module --check lib/visionProcessor.js
      - name: Run identity/review regression
        run: node --experimental-default-type=module scripts/scan-review-regression.js
