name: NYEOCARE Sentinel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production health
        run: |
          set -e
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --max-time 15 https://nyeocare.vercel.app/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
