name: NYEOCARE Vercel deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nyeocare-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Hfzh4uRE9xewPAaGVjun6h19
      VERCEL_PROJECT_ID: prj_flnxmzr4QNgJK3SthDetLN0OLFKK
      VERCEL_CLI_VERSION: 59.23.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Deploy to Vercel
        run: npx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
